name: Build and Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.0)'
        required: true
        default: '0.8.0'
      package_type:
        description: 'Package type: full or light'
        required: true
        type: choice
        options:
          - full
          - light
        default: 'full'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Windows Installer
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Trust runner workspace
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\\\', '/'
          git config --global --add safe.directory $workspace

      - name: Verify pinned vendor dependencies
        run: python scripts/ci/verify-vendor.py

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check release version
        shell: pwsh
        run: |
          $requested = $env:VERSION -replace '^v', ''
          $source = (Get-Content version.txt -Raw).Trim()
          if ($requested -ne $source) { throw "Requested version $requested does not match version.txt $source" }
          python scripts/apply_version.py --check

      - name: Install Inno Setup Chinese language file
        shell: pwsh
        run: ./scripts/ci/install-inno-language.ps1

      - name: Install Boost via vcpkg
        shell: pwsh
        run: |
          Push-Location $env:VCPKG_INSTALLATION_ROOT
          ./vcpkg install boost-locale:x64-windows-static-md boost-json:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { $installExit = $LASTEXITCODE; Pop-Location; exit $installExit }
          Pop-Location
          "BOOST_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Build 64-bit TSF DLL
        shell: pwsh
        run: |
          cmake -S windows -B windows/build64-release -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build windows/build64-release --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --no-tests=error --test-dir windows/build64-release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build 32-bit TSF DLL
        shell: pwsh
        run: |
          cmake -S windows -B windows/build32-release -A Win32 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build windows/build32-release --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --no-tests=error --test-dir windows/build32-release -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Server Boost dependencies
        shell: pwsh
        run: ./scripts/ci/install-boost.ps1

      - name: Build Server
        shell: pwsh
        run: |
          cmake -S server -B server/build-release -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build server/build-release --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Server tests with locked product data
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/test-server.ps1 -ServerRoot server -StagingRoot "$env:RUNNER_TEMP/product-data" -BuildDir build-release

      - name: Configure Engine tests
        shell: pwsh
        run: |
          cmake -S engine -B engine/build-release -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Engine tests
        shell: pwsh
        run: |
          cmake --build engine/build-release --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Engine tests with locked product data
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/test-engine.ps1 -BuildDir engine/build-release -StagingRoot "$env:RUNNER_TEMP/product-data"

      - name: Prepare Package Files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_TYPE: ${{ inputs.package_type || 'full' }}
        run: |
          $ver = $env:VERSION -replace '^v', ''
          if ($env:PKG_TYPE -eq 'light') {
              write-host "Preparing Light package files for version $ver..."
              ./installer/Prepare-PackageFiles.ps1 -TargetVersion $ver -Light
          } else {
              write-host "Fetching dictionaries and models for full package version $ver..."
              python scripts/product_lock.py fetch-dictionaries --staging-root .
              ./scripts/download-neural-model.ps1
              ./scripts/build-language-model.ps1
              ./installer/Prepare-PackageFiles.ps1 -TargetVersion $ver
          }

      - name: Compile Installer with Inno Setup
        shell: pwsh
        env:
          PKG_TYPE: ${{ inputs.package_type || 'full' }}
        run: |
          if ($env:PKG_TYPE -eq 'light') {
              ./installer/Compile-Installer.ps1 -Light
          } else {
              ./installer/Compile-Installer.ps1
          }

      - name: Write SHA-256 sidecar
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer/Output/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'No installer exe found' }
          python scripts/ci/write_sha256.py $installer.FullName

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arong-Study-IME-Installer
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMP_VER: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:TEMP_VER -replace '^v', ''
          $tag = "v$version"
          $installer = Get-ChildItem -Path installer/Output/*.exe | Select-Object -First 1
          if (-not $installer) { Write-Error 'No installer exe found'; exit 1 }
          $checksum = Get-Item ($installer.FullName + '.sha256')
          Write-Host "Publishing $tag with $($installer.Name)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $installer.FullName $checksum.FullName --clobber
          } else {
              gh release create $tag $installer.FullName $checksum.FullName --target $env:GITHUB_SHA --title "阿龍学习输入法 $tag" --latest --notes "Windows x64/x86 installer, built and tested by GitHub Actions from commit $env:GITHUB_SHA. The unsigned installer SHA-256 is published in the sidecar file."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
